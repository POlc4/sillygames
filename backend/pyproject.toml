[project]
name = "sillygames-backend"
version = "0.1.0"
description = "API et moteurs de jeu de SillyGames"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "pyjwt>=2.10",
  "pwdlib[argon2]>=0.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["error::DeprecationWarning:app"]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Le dossier alembic/ (migrations) porte le même nom que la bibliothèque.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
