# Stack locale complète, avec les mêmes images qu'en production.
# - postgres seul : docker compose up -d postgres (dev dans le devcontainer, backend/front en hot-reload)
# - tout : docker compose up --build (intégration, tests bout en bout)
# Chargé aussi par le devcontainer, qui n'en démarre que postgres.
name: sillygames

services:
  postgres:
    image: mirror.gcr.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sillygames}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sillygames}
      POSTGRES_DB: ${POSTGRES_DB:-sillygames}
    ports:
      # Exposé uniquement en local pour psql / outils graphiques depuis l'hôte.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sillygames} -d ${POSTGRES_DB:-sillygames}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: sillygames-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sillygames}:${POSTGRES_PASSWORD:-sillygames}@postgres:5432/${POSTGRES_DB:-sillygames}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me-000}
      COOKIE_SECURE: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8000
    image: sillygames-frontend:local
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
