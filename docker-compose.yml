# Environnement de développement.
# Chargé aussi par le devcontainer (.devcontainer/devcontainer.json), qui ajoute le service "dev".
# Les services backend et frontend seront ajoutés à l'étape 5 du plan.
name: sillygames

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sillygames}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sillygames}
      POSTGRES_DB: ${POSTGRES_DB:-sillygames}
    ports:
      # Exposé uniquement en local pour psql / outils graphiques depuis l'hôte.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sillygames} -d ${POSTGRES_DB:-sillygames}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
