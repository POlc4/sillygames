# Revue automatique des PR par Claude, selon les règles de CLAUDE.md.
# Sécurité : jamais `pull_request_target` ; seules les PR de l'auteur du dépôt ou de collaborateurs,
# venant de ce dépôt (pas d'un fork), déclenchent la revue. Le jeton vient de l'abonnement Claude
# (secret CLAUDE_CODE_OAUTH_TOKEN, posé par `claude /install-github-app`). Sans secret, le job se saute.
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Check the Claude token is configured
        id: token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "present=$([ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Review
        if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@5ccc3a35a6367cdb8e6fbd0728287467540ecfe2 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Relis cette pull request en appliquant les règles de CLAUDE.md (racine, backend/, frontend/).
            Vérifie en priorité : bugs de logique, sécurité (secrets, injections, actions non épinglées,
            pull_request_target), tests manquants pour tout comportement ajouté ou modifié, migrations
            Alembic modifiées après merge, documentation à mettre à jour (README journal, ADR, runbook),
            respect des Conventional Commits. Ne commente que ce qui est actionnable, en français,
            avec des références de fichiers et de lignes. Termine par un résumé de deux lignes.
            Publie la revue avec `gh pr comment`.
          claude_args: '--allowed-tools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"'
