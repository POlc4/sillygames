# Claude répond aux mentions @claude dans les issues et PR, et peut ouvrir une PR.
# Sécurité : seuls l'auteur du dépôt et les collaborateurs déclenchent le workflow (un inconnu
# ne peut ni consommer le quota ni injecter de consigne). Toute PR ouverte par Claude passe la CI
# et la revue habituelles, jamais de merge automatique.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: >-
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association || github.event.issue.author_association) &&
      contains(github.event.comment.body || github.event.issue.body || '', '@claude')
    runs-on: ubuntu-latest
    steps:
      - name: Check the Claude token is configured
        id: token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "present=$([ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude
        if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@5ccc3a35a6367cdb8e6fbd0728287467540ecfe2 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git:*),Read,Edit,Write,Grep,Glob"'
