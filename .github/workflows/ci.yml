# CI qualité. Les actions sont épinglées par SHA de commit (voir CLAUDE.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: sillygames
          POSTGRES_PASSWORD: sillygames
          POSTGRES_DB: sillygames
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sillygames -d sillygames"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sillygames:sillygames@localhost:5432/sillygames
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Migrations apply, match models, and roll back
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base

      - name: Tests (unit + integration against Postgres)
        run: uv run pytest

  frontend:
    name: Frontend (prettier, eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests (unit + components against a mocked API)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  images:
    name: Images (hadolint, compose build, e2e Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: backend/Dockerfile

      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: frontend/Dockerfile

      - name: Lint devcontainer Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: .devcontainer/Dockerfile

      - name: Build images
        run: |
          docker compose build 2>&1 | tee /tmp/build.log
          exit "${PIPESTATUS[0]}"

      - name: Start the stack
        run: docker compose up -d --wait

      - name: Smoke test through the frontend proxy
        run: |
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS -o /dev/null http://127.0.0.1:3000/

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: frontend
        env:
          CI: 1
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Diagnostics on failure (also emitted as annotations, readable without login)
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail 60 || true
          if [ -f /tmp/build.log ]; then
            echo "::error title=docker compose build (tail)::$(tail -c 3500 /tmp/build.log | tr '\n' ' ')"
          fi
          echo "::error title=docker compose ps::$(docker compose ps -a --format '{{.Service}}={{.State}}/{{.Health}}' 2>/dev/null | tr '\n' ' ')"
          for s in postgres backend frontend; do
            echo "::warning title=logs $s::$(docker compose logs --no-color --tail 20 "$s" 2>&1 | tr '\n' ' ' | tail -c 3500)"
          done

      - name: Stop the stack
        if: always()
        run: docker compose down -v
